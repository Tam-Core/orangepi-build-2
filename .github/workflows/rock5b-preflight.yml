name: Rock 5B static preflight

on:
  push:
    branches:
      - rock5b-minimal-microsd
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  preflight:
    name: Check Rock 5B board definitions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run static configuration checks
        run: bash tests/rock5b-preflight.sh

      - name: Check effective configuration and existing board regression
        run: bash tests/rock5b-effective-config.sh
      - name: Check image inspector syntax
        run: bash -n tests/rock5b-image-check.sh
