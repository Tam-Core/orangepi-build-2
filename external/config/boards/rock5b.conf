# Experimental Radxa ROCK 5B (RK3588) board port.
# First milestone: Debian 13 (Trixie), ARM64, next kernel only.
# The U-Boot override is in sources/families/rockchip-rk3588.conf.
# Do NOT flash SPI: test boot from a removable microSD card.
BOARD_NAME="Radxa ROCK 5B (experimental)"
BOARDFAMILY="rockchip-rk3588"
BOOTCONFIG="rock-5b-rk3588_defconfig"
KERNEL_TARGET="next"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588-rock-5b.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="no"
SKIP_BOOTSPLASH="yes"
DISTRIB_TYPE_NEXT="trixie"
REVISION="0.1.0"
